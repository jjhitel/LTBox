name: Publish package-manager artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, e.g. v3.2.8
        required: true
        type: string
      publish_manifests:
        description: Also push the rendered manifests to the bucket and tap
        required: false
        default: false
        type: boolean
      publish_linux_repository:
        description: Also replace the hosted APT and YUM repository
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NFPM_TOOL_VERSION: "2.47.0"

jobs:
  package-linux:
    name: Package Linux ${{ matrix.release_arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x86_64
            nfpm_arch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - release_arch: arm64
            nfpm_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          # Packaging inputs come from the ref being run, not the release tag:
          # a dry run against an older tag still needs this branch's templates.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Download and verify published Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          set -euo pipefail
          asset="LTBox-linux_${RELEASE_ARCH}-${TAG}.tar.gz"
          mkdir -p release-assets packaging-stage
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --pattern "${asset}" \
            --pattern "${asset}.sha256"
          (cd release-assets && sha256sum --check "${asset}.sha256")
          tar -xzf "release-assets/${asset}" -C release-assets
          install -m 0755 \
            "release-assets/LTBox-linux_${RELEASE_ARCH}-${TAG}/ltbox" \
            packaging-stage/ltbox
          sed 's|__LTBOX_EXEC__|/usr/bin/ltbox|g' \
            misc/desktop/io.github.miner7222.LTBox.desktop \
            > packaging-stage/io.github.miner7222.LTBox.desktop

      - name: Build deb and rpm from the release binary
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist

          printf 'deb\n' > packaging-stage/ltbox.install-source
          docker run --rm \
            -e NFPM_ARCH="${NFPM_ARCH}" \
            -e NFPM_VERSION="${version}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "ghcr.io/goreleaser/nfpm:v${{ env.NFPM_TOOL_VERSION }}" package \
            --config packaging/linux/nfpm.yaml \
            --packager deb \
            --target "/work/dist/ltbox_${version}_${DEB_ARCH}.deb"

          printf 'rpm\n' > packaging-stage/ltbox.install-source
          rpm_signing_key_file=""
          rpm_signing_key_id=""
          if [[ -n "${REPO_GPG_PRIVATE_KEY}" && -n "${REPO_GPG_PASSPHRASE}" ]]; then
            signing_key="packaging-stage/repository-signing-key.asc"
            printf '%s\n' "${REPO_GPG_PRIVATE_KEY}" > "${signing_key}"
            chmod 0600 "${signing_key}"

            signing_home="$(mktemp -d)"
            chmod 0700 "${signing_home}"
            GNUPGHOME="${signing_home}" gpg --batch --quiet --import "${signing_key}"
            rpm_signing_key_id="$(
              GNUPGHOME="${signing_home}" gpg --batch --with-colons --list-secret-keys |
                awk -F: '
                  ($1 == "sec" || $1 == "ssb") && tolower($12) ~ /s/ {
                    print $5
                    exit
                  }
                '
            )"
            rm -rf "${signing_home}"
            if [[ -z "${rpm_signing_key_id}" ]]; then
              echo "Repository private key has no signing-capable key." >&2
              exit 1
            fi
            rpm_signing_key_file="/work/${signing_key}"
          elif [[ -n "${REPO_GPG_PRIVATE_KEY}" || -n "${REPO_GPG_PASSPHRASE}" ]]; then
            echo "::notice::Building an unsigned RPM because REPO_GPG_PRIVATE_KEY and REPO_GPG_PASSPHRASE are not both configured. Repository publication will be skipped."
          else
            echo "::notice::Building an unsigned RPM because repository signing secrets are not configured. Repository publication will be skipped."
          fi

          docker run --rm \
            -e NFPM_ARCH="${NFPM_ARCH}" \
            -e NFPM_VERSION="${version}" \
            -e NFPM_RPM_SIGNING_KEY_FILE="${rpm_signing_key_file}" \
            -e NFPM_RPM_SIGNING_KEY_ID="${rpm_signing_key_id}" \
            -e NFPM_RPM_PASSPHRASE="${REPO_GPG_PASSPHRASE}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "ghcr.io/goreleaser/nfpm:v${{ env.NFPM_TOOL_VERSION }}" package \
            --config packaging/linux/nfpm.yaml \
            --packager rpm \
            --target "/work/dist/ltbox-${version}-1.${RPM_ARCH}.rpm"
          rm -f packaging-stage/repository-signing-key.asc

          (
            cd dist
            sha256sum "ltbox_${version}_${DEB_ARCH}.deb" \
              > "ltbox_${version}_${DEB_ARCH}.deb.sha256"
            sha256sum "ltbox-${version}-1.${RPM_ARCH}.rpm" \
              > "ltbox-${version}-1.${RPM_ARCH}.rpm.sha256"
          )

      - name: Upload Linux packages as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.release_arch }}
          path: dist/*

      - name: Attach Linux packages to the published release
        # A manual run inspects the artifact above instead of mutating a release.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  publish-linux-repository:
    name: Build and publish APT and YUM repositories
    needs: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check repository publishing prerequisites
        id: repository
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${REPO_GPG_PRIVATE_KEY}" ]] || missing+=(REPO_GPG_PRIVATE_KEY)
          [[ -n "${REPO_GPG_PASSPHRASE}" ]] || missing+=(REPO_GPG_PASSPHRASE)
          [[ -n "${REPO_GITHUB_TOKEN}" ]] || missing+=(REPO_GITHUB_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::Skipping miner7222/ltbox-repo: Actions secret(s) ${missing[*]} are not configured."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! repository_json="$(GH_TOKEN="${REPO_GITHUB_TOKEN}" gh api repos/miner7222/ltbox-repo 2>/dev/null)"; then
            echo "::warning::Skipping miner7222/ltbox-repo: repository is unreachable or REPO_GITHUB_TOKEN cannot access it."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "default_branch=$(jq -r '.default_branch // "main"' <<<"${repository_json}")" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        if: steps.repository.outputs.enabled == 'true'
        with:
          # Repository inputs come from the ref being run, not the release tag:
          # a dry run against an older tag still needs this branch's scripts.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Download signed Linux packages
        if: steps.repository.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: linux-packages-*
          path: repository-packages
          merge-multiple: true

      - name: Install repository metadata tools
        if: steps.repository.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            createrepo-c \
            rpm

      - name: Build signed repository tree
        if: steps.repository.outputs.enabled == 'true'
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/ltbox-repository-private.asc"
          cleanup() {
            rm -f "${private_key}"
          }
          trap cleanup EXIT
          printf '%s\n' "${REPO_GPG_PRIVATE_KEY}" > "${private_key}"
          chmod 0600 "${private_key}"
          bash packaging/linux/build_repository.sh \
            --tag "${TAG}" \
            --packages-dir repository-packages \
            --output-dir repository-site \
            --private-key "${private_key}"

      - name: Validate repository with stock clients
        if: steps.repository.outputs.enabled == 'true'
        run: bash packaging/linux/validate_repository.sh repository-site

      - name: Upload repository dry-run artifact
        if: steps.repository.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-repository-${{ github.event.release.tag_name || inputs.tag }}
          path: repository-site/
          include-hidden-files: true
          if-no-files-found: error

      - name: Report repository dry run
        if: >-
          steps.repository.outputs.enabled == 'true' &&
          github.event_name != 'release' &&
          inputs.publish_linux_repository != true
        run: echo "::notice::Signed APT and YUM repository dry run passed; no external repository was changed."

      - name: Replace hosted repository with one orphan commit
        if: >-
          steps.repository.outputs.enabled == 'true' &&
          (github.event_name == 'release' || inputs.publish_linux_repository)
        env:
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ steps.repository.outputs.default_branch }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -u

          publish_repository() {
            local repository="miner7222/ltbox-repo"
            local worktree="external-ltbox-repo"
            rm -rf "${worktree}"

            if ! GH_TOKEN="${REPO_GITHUB_TOKEN}" gh repo clone "${repository}" "${worktree}" -- --depth 1; then
              echo "::warning::Skipping ${repository}: clone failed with REPO_GITHUB_TOKEN."
              return 0
            fi
            if ! git -C "${worktree}" switch --orphan repository-current; then
              echo "::warning::Skipping ${repository}: could not create the replacement orphan commit."
              return 0
            fi
            if ! cp -a repository-site/. "${worktree}/"; then
              echo "::warning::Skipping ${repository}: could not stage the rendered repository."
              return 0
            fi

            git -C "${worktree}" config user.name "github-actions[bot]"
            git -C "${worktree}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C "${worktree}" add --all; then
              echo "::warning::Skipping ${repository}: could not stage the rendered repository."
              return 0
            fi
            if ! git -C "${worktree}" commit -m "chore: Publish LTBox repository ${VERSION}"; then
              echo "::warning::Skipping ${repository}: could not commit the rendered repository."
              return 0
            fi

            GH_TOKEN="${REPO_GITHUB_TOKEN}" gh auth setup-git > /dev/null
            if ! GH_TOKEN="${REPO_GITHUB_TOKEN}" git -C "${worktree}" push --force origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "::warning::Skipping ${repository}: REPO_GITHUB_TOKEN lacks force-push access or the branch rejects force pushes."
              return 0
            fi
            echo "::notice::Published ${VERSION} APT and YUM repositories to ${repository}@${DEFAULT_BRANCH}."
          }

          publish_repository

  publish-manifests:
    name: Publish Scoop and Homebrew manifests
    needs: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Packaging inputs come from the ref being run, not the release tag:
          # a dry run against an older tag still needs this branch's templates.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Download published checksum sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-sidecars
          for asset in \
            "LTBox-win_x86_64-${TAG}.zip.sha256" \
            "LTBox-win_arm64-${TAG}.zip.sha256" \
            "LTBox-macos_universal-${TAG}.tar.gz.sha256"
          do
            gh release download "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir release-sidecars \
              --pattern "${asset}"
          done

      - name: Render and validate manifests from sidecars
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          python3 packaging/render_manifests.py \
            --tag "${TAG}" \
            --win-x86-64-sidecar "release-sidecars/LTBox-win_x86_64-${TAG}.zip.sha256" \
            --win-arm64-sidecar "release-sidecars/LTBox-win_arm64-${TAG}.zip.sha256" \
            --macos-universal-sidecar "release-sidecars/LTBox-macos_universal-${TAG}.tar.gz.sha256" \
            --output-dir rendered
          ruby -c rendered/homebrew/Casks/ltbox.rb

      - name: Publish external manifests when repositories are ready
        # Manual runs render and validate by default; pushing is opt-in.
        if: github.event_name == 'release' || inputs.publish_manifests
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          publish_file() {
            local token="$1"
            local secret_name="$2"
            local repository="$3"
            local source_file="$4"
            local destination_file="$5"

            if [[ -z "${token}" ]]; then
              echo "::notice::Skipping ${repository}: Actions secret ${secret_name} is not configured."
              return 0
            fi

            local repository_json
            if ! repository_json="$(GH_TOKEN="${token}" gh api "repos/${repository}" 2>/dev/null)"; then
              echo "::warning::Skipping ${repository}: repository is missing or ${secret_name} cannot access it."
              return 0
            fi

            local default_branch
            default_branch="$(jq -r '.default_branch // "main"' <<<"${repository_json}")"
            local worktree="external-${repository##*/}"
            rm -rf "${worktree}"
            if ! GH_TOKEN="${token}" gh repo clone "${repository}" "${worktree}" -- --depth 1; then
              echo "::warning::Skipping ${repository}: clone failed with ${secret_name}."
              return 0
            fi

            mkdir -p "${worktree}/$(dirname "${destination_file}")"
            cp "${source_file}" "${worktree}/${destination_file}"
            git -C "${worktree}" config user.name "github-actions[bot]"
            git -C "${worktree}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "${worktree}" add "${destination_file}"
            if git -C "${worktree}" diff --cached --quiet; then
              echo "::notice::${repository}/${destination_file} already matches ${VERSION}."
              return 0
            fi
            if ! git -C "${worktree}" commit -m "chore: Update LTBox to ${VERSION}"; then
              echo "::warning::Skipping ${repository}: could not commit the rendered manifest."
              return 0
            fi

            GH_TOKEN="${token}" gh auth setup-git >/dev/null
            if ! GH_TOKEN="${token}" git -C "${worktree}" push origin "HEAD:${default_branch}"; then
              echo "::warning::Skipping ${repository}: ${secret_name} lacks push access or the branch requires a pull request."
              return 0
            fi
            echo "::notice::Published ${destination_file} to ${repository}@${default_branch}."
          }

          publish_file \
            "${SCOOP_BUCKET_TOKEN}" \
            SCOOP_BUCKET_TOKEN \
            miner7222/scoop-bucket \
            rendered/scoop/ltbox.json \
            bucket/ltbox.json

          publish_file \
            "${HOMEBREW_TAP_TOKEN}" \
            HOMEBREW_TAP_TOKEN \
            miner7222/homebrew-tap \
            rendered/homebrew/Casks/ltbox.rb \
            Casks/ltbox.rb
